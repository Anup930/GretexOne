<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Active Employees — Gretex Emp Master</title>
<style>

    :root{
      --bg:#0b1120; --bg-soft:#111a2e; --surface:#16213a; --surface-2:#1c2a47;
      --border:#26385c; --text:#e7ecf6; --text-dim:#93a2c2; --text-faint:#5f708f;
      --accent:#4f7dff; --accent-2:#7c5cff; --accent-soft:#20305a;
      --green:#2ecc8f; --amber:#ffb545; --red:#ff5d6c;
      --radius:14px; --radius-sm:9px;
      --shadow:0 10px 30px rgba(0,0,0,.35);
      --font:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:var(--font);background:
      radial-gradient(1200px 600px at 10% -10%, #16244a 0%, transparent 60%),
      radial-gradient(1000px 500px at 100% 0%, #201a44 0%, transparent 55%),
      var(--bg);color:var(--text);min-height:100vh;}
    a{color:inherit}
    ::-webkit-scrollbar{width:10px;height:10px}
    ::-webkit-scrollbar-thumb{background:var(--surface-2);border-radius:8px}

    .app-shell{display:flex;min-height:100vh}
    .sidebar{width:230px;flex-shrink:0;background:linear-gradient(180deg,var(--bg-soft),#0d1526);
      border-right:1px solid var(--border);padding:22px 16px;position:sticky;top:0;height:100vh}
    .brand{display:flex;align-items:center;gap:10px;margin-bottom:28px;padding:0 4px}
    .brand-mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-2));
      display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;box-shadow:0 6px 16px rgba(79,125,255,.4)}
    .brand-text{line-height:1.15}
    .brand-text b{font-size:15px;display:block}
    .brand-text span{font-size:11px;color:var(--text-dim)}
    .nav a{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;
      color:var(--text-dim);text-decoration:none;font-size:14px;font-weight:500;margin-bottom:4px;transition:.15s}
    .nav a:hover{background:var(--surface);color:var(--text)}
    .nav a.active{background:var(--accent-soft);color:#cfe0ff;box-shadow:inset 0 0 0 1px rgba(124,92,255,.35)}
    .nav .ico{width:18px;text-align:center;font-size:15px}
    .sidebar-foot{position:absolute;bottom:20px;left:16px;right:16px}
    .userchip{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:var(--surface);margin-bottom:8px}
    .userchip .av{width:30px;height:30px;border-radius:50%;background:var(--accent-2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
    .userchip .who{font-size:12.5px;line-height:1.2}
    .userchip .who b{display:block;font-size:13px}
    .logout-btn{width:100%;padding:9px;border-radius:9px;border:1px solid var(--border);background:transparent;color:var(--text-dim);cursor:pointer;font-size:13px}
    .logout-btn:hover{background:var(--surface);color:var(--red)}

    .main{flex:1;padding:26px 32px;max-width:100%;overflow-x:hidden}
    .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;flex-wrap:wrap;gap:12px}
    .topbar h1{font-size:21px;margin:0}
    .topbar p{margin:2px 0 0;color:var(--text-dim);font-size:13px}

    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:16px}
    .filters-group {display:flex;gap:10px;flex-wrap:wrap;flex:1;}
    .search{background:var(--bg-soft);border:1px solid var(--border);border-radius:10px;
      padding:10px 14px;color:var(--text);font-size:14px}
    .search:focus{outline:none;border-color:var(--accent)}
    select.search option { background: var(--surface); color: var(--text); }
    .btn{border:none;border-radius:10px;padding:10px 16px;font-size:13.5px;font-weight:600;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:6px}
    .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff}
    .btn-primary:hover{filter:brightness(1.08)}
    .btn-ghost{background:var(--surface-2);color:var(--text)}
    .btn-ghost:hover{background:#233a5e}
    .btn-danger{background:rgba(255,93,108,.12);color:var(--red);border:1px solid rgba(255,93,108,.35)}
    .btn-danger:hover{background:rgba(255,93,108,.2)}
    .btn-amber{background:rgba(255,181,69,.12);color:var(--amber);border:1px solid rgba(255,181,69,.35)}
    .btn-amber:hover{background:rgba(255,181,69,.2)}
    .btn-green{background:rgba(46,204,143,.12);color:var(--green);border:1px solid rgba(46,204,143,.35)}
    .btn-green:hover{background:rgba(46,204,143,.2)}
    .btn-sm{padding:6px 10px;font-size:12px;border-radius:8px}
    .btn:disabled{opacity:.5;cursor:not-allowed}

    table{width:100%;border-collapse:collapse;font-size:13.5px}
    thead th{text-align:left;padding:11px 14px;color:var(--text-dim);font-weight:600;font-size:12px;
      text-transform:uppercase;letter-spacing:.03em;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;background:var(--surface)}
    tbody td{padding:11px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
    tbody tr:hover{background:var(--surface-2)}
    .table-wrap{overflow:auto;max-height:65vh;border-radius:var(--radius-sm)}
    .pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700}
    .pill-blue{background:rgba(79,125,255,.15);color:#9db6ff}
    .pill-green{background:rgba(46,204,143,.15);color:var(--green)}
    .pill-amber{background:rgba(255,181,69,.15);color:var(--amber)}
    .pill-red{background:rgba(255,93,108,.15);color:var(--red)}
    .actions-cell{display:flex;gap:6px}
    .empty-state{text-align:center;padding:60px 20px;color:var(--text-faint)}
    .loading{text-align:center;padding:50px;color:var(--text-dim)}

    .modal-overlay{position:fixed;inset:0;background:rgba(5,8,18,.65);backdrop-filter:blur(3px);
      display:none;align-items:flex-start;justify-content:center;z-index:100;padding:40px 16px;overflow:auto}
    .modal-overlay.show{display:flex}
    .modal{background:var(--bg-soft);border:1px solid var(--border);border-radius:var(--radius);
      width:100%;max-width:840px;box-shadow:var(--shadow);animation:pop .15s ease}
    @keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}
    .modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--border)}
    .modal-head h3{margin:0;font-size:16px}
    .modal-close{background:none;border:none;color:var(--text-dim);font-size:20px;cursor:pointer}
    .modal-body{padding:20px 22px;max-height:70vh;overflow:auto}
    .modal-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
    fieldset{border:1px solid var(--border);border-radius:10px;margin-bottom:14px;padding:12px 16px}
    legend{font-size:12px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:0 6px}
    .field-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
    .field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:5px}
    .field input,.field select,.field textarea{width:100%;background:var(--surface);border:1px solid var(--border);
      border-radius:8px;padding:9px 10px;color:var(--text);font-size:13.5px;font-family:var(--font)}
    .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent)}
    .field textarea{resize:vertical;min-height:60px}

    .toast-wrap{position:fixed;top:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:8px}
    .toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);
      padding:12px 16px;border-radius:10px;font-size:13.5px;box-shadow:var(--shadow);min-width:240px;animation:slide .2s ease}
    .toast.success{border-left-color:var(--green)}
    .toast.error{border-left-color:var(--red)}
    @keyframes slide{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}

    .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:22px}
    .kpi{padding:16px;border-radius:var(--radius);position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow)}
    .kpi .n{font-size:26px;font-weight:800;margin:2px 0}
    .kpi .l{font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.03em}
    .kpi .ico{position:absolute;right:16px;top:16px;font-size:24px;opacity:.35}

    @media (max-width:760px){
      .app-shell{flex-direction:column}
      .sidebar{width:100%;height:auto;position:relative;padding:14px}
      .main{padding:18px}
    }

</style>
</head>
<body>
<div class="app-shell">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">GX</div>
      <div class="brand-text"><b>Gretex Emp Master</b><span>Employee Lifecycle</span></div>
    </div>
    <nav class="nav">
      <a class="" href="dashboard.html"><span class="ico">📊</span>Dashboard</a>
      <a class="" href="newjoinee.html"><span class="ico">🆕</span>New Joinee</a>
      <a class="active" href="active.html"><span class="ico">✅</span>Active</a>
      <a class="" href="resignation.html"><span class="ico">🚪</span>Resignation</a>
      <a class="" href="fnf.html"><span class="ico">💰</span>FNF</a>
      <a class="" href="compliance.html"><span class="ico">⏱️</span>Attendance Compliance</a>
    </nav>
    <div class="sidebar-foot">
      <div class="userchip">
        <div class="av" id="userAv">?</div>
        <div class="who"><b id="userName">-</b><span id="userRole">-</span></div>
      </div>
      <button class="logout-btn" onclick="doLogout()">⎋ Logout</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h1>Active Employees</h1>
        <p>Currently active employee master — full profile records</p>
      </div>
      <button class="btn btn-primary" onclick="openAddModal()">+ Add Record</button>
    </div>

    <!-- UPDATE: Top KPI Row for counts -->
    <div class="kpi-grid" id="topKpis">
       <!-- Dynamically injected via JS -->
    </div>

    <div class="card" style="padding:16px">
      <!-- UPDATE: Filters and Download Button -->
      <div class="toolbar">
        <div class="filters-group">
          <input class="search" id="searchBox" placeholder="Search by name, ID..." style="max-width:220px; flex:1;" oninput="renderTable()">
          <select class="search" id="statusFilter" style="min-width:140px; cursor:pointer;" onchange="renderTable()">
            <!-- Options populated dynamically -->
          </select>
          <select class="search" id="companyFilter" style="min-width:140px; cursor:pointer;" onchange="renderTable()">
            <option value="ALL">Company: All</option>
          </select>
          <select class="search" id="deptFilter" style="min-width:140px; cursor:pointer;" onchange="renderTable()">
            <option value="ALL">Dept: All</option>
          </select>
        </div>
        <div style="display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
          <span id="recordCount" style="color:var(--text-dim);font-size:12.5px; white-space:nowrap;"></span>
          <button class="btn btn-green" onclick="downloadCSV()" title="Export Filtered Data to CSV">⬇ Export CSV</button>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead><tr id="tableHead"></tr></thead>
          <tbody id="tableBody"><tr><td colspan="10" class="loading">Loading records...</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

  <!-- Add/Edit modal -->
  <div class="modal-overlay" id="editModalOverlay">
    <div class="modal">
      <div class="modal-head"><h3 id="editModalTitle">Add Record</h3><button class="modal-close" onclick="closeEditModal()">&times;</button></div>
      <div class="modal-body" id="editModalBody"></div>
      <div class="modal-foot">
        <button class="btn btn-ghost" onclick="closeEditModal()">Cancel</button>
        <button class="btn btn-primary" id="saveBtn" onclick="saveRecord()">Save</button>
      </div>
    </div>
  </div>

  <!-- Move modal -->
  <div class="modal-overlay" id="moveModalOverlay">
    <div class="modal" style="max-width:560px">
      <div class="modal-head"><h3>Move to Resignation</h3><button class="modal-close" onclick="closeMoveModal()">&times;</button></div>
      <div class="modal-body"><div class="field-grid"><div class="field"><label>Emp Status</label><select id="mv_empStatus"><option value="">--</option><option value="Resigned">Resigned</option><option value="Notice Period">Notice Period</option><option value="Absconded">Absconded</option><option value="Terminated">Terminated</option></select></div><div class="field"><label>Date of Resignation (DOR)</label><input type="date" id="mv_dor"></div><div class="field"><label>Last Working Day (LWD)</label><input type="date" id="mv_lwd"></div><div class="field"><label>Notice Pay</label><input type="text" id="mv_noticePay"></div><div class="field"><label>IT Asset Handover</label><select id="mv_itAssetHandover"><option value="">--</option><option value="Yes">Yes</option><option value="No">No</option><option value="Pending">Pending</option></select></div><div class="field"><label>FNF Remarks</label><input type="text" id="mv_fnf"></div><div class="field"><label>Relieving</label><input type="text" id="mv_relieving"></div><div class="field"><label>Remarks</label><textarea id="mv_remarks"></textarea></div></div></div>
      <div class="modal-foot">
        <button class="btn btn-ghost" onclick="closeMoveModal()">Cancel</button>
        <button class="btn btn-amber" onclick="confirmMove()">Confirm &amp; Move</button>
      </div>
    </div>
  </div>


<script>

    // ====== Config ======
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzcLIgiumk49XlL7ngXYjtsRmUc93DC8mIZQZhv3b-hHBTZyXKVBkjWzUzySbI_FNlx/exec';

    // ====== Auth guard ======
    function getSession(){
      try { return JSON.parse(sessionStorage.getItem('gretex_user') || 'null'); }
      catch(e){ return null; }
    }
    function requireAuth(){
      const u = getSession();
      if(!u){ window.location.href = 'index.html'; return null; }
      const nameEl = document.getElementById('userName');
      const roleEl = document.getElementById('userRole');
      const avEl = document.getElementById('userAv');
      if(nameEl) nameEl.textContent = u.name || u.username;
      if(roleEl) roleEl.textContent = u.role || 'User';
      if(avEl) avEl.textContent = (u.name || u.username || '?').trim().charAt(0).toUpperCase();
      return u;
    }
    function doLogout(){
      sessionStorage.removeItem('gretex_user');
      window.location.href = 'index.html';
    }

    // ====== API helpers ======
    async function apiGet(action, params){
      const qs = new URLSearchParams({ action, ...(params||{}) }).toString();
      const res = await fetch(`${APPS_SCRIPT_URL}?${qs}`);
      const json = await res.json();
      if(!json.success) throw new Error(json.error || 'Request failed');
      return json.data;
    }
    async function apiPost(payload){
      const res = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      const json = await res.json();
      if(!json.success) throw new Error(json.error || 'Request failed');
      return json.data;
    }

    // ====== Toast ======
    function toast(msg, type){
      let wrap = document.getElementById('toastWrap');
      if(!wrap){
        wrap = document.createElement('div');
        wrap.id = 'toastWrap';
        wrap.className = 'toast-wrap';
        document.body.appendChild(wrap);
      }
      const el = document.createElement('div');
      el.className = 'toast ' + (type || '');
      el.textContent = msg;
      wrap.appendChild(el);
      setTimeout(()=> el.remove(), 3500);
    }

    requireAuth();

    const SHEET_KEY = 'active';
    const FIELDS = [{"label": "Emp ID", "type": "number", "options": [], "group": "Basic Info"}, {"label": "Employee Name", "type": "text", "options": [], "group": "Basic Info"}, {"label": "Status", "type": "select", "options": ["NEW JOINEE", "ACTIVE", "INACTIVE", "RESIGNED", "FNF DONE"], "group": "Basic Info"}, {"label": "Company Name", "type": "select", "options": ["GRETEX SHARE BROKING LIMITED", "GRETEX CORPORATE SERVICES LIMITED", "GRETEX INDUSTRIES LIMITED", "GRETEX ADMIN & HR SERVICES", "GRETEX ASSOCIATES LLP", "GRETEX EZ LLP"], "group": "Basic Info"}, {"label": "Current Status", "type": "text", "options": [], "group": "Basic Info"}, {"label": "Sub Company", "type": "text", "options": [], "group": "Basic Info"}, {"label": "Type of Employment", "type": "select", "options": ["Permanent", "Intern", "Contract", "Probation"], "group": "Employment"}, {"label": "Designation", "type": "text", "options": [], "group": "Employment"}, {"label": "Department", "type": "text", "options": [], "group": "Employment"}, {"label": "Sub Department", "type": "text", "options": [], "group": "Employment"}, {"label": "Level", "type": "text", "options": [], "group": "Employment"}, {"label": "Location", "type": "text", "options": [], "group": "Employment"}, {"label": "Sub Location", "type": "text", "options": [], "group": "Employment"}, {"label": "Date of Joining (DOJ)", "type": "date", "options": [], "group": "Employment"}, {"label": "Year of Service with Gretex", "type": "text", "options": [], "group": "Employment"}, {"label": "Promotion Date", "type": "date", "options": [], "group": "Employment"}, {"label": "Joining Month", "type": "text", "options": [], "group": "Employment"}, {"label": "Experience", "type": "text", "options": [], "group": "Employment"}, {"label": "Gender", "type": "select", "options": ["MALE", "FEMALE", "OTHER"], "group": "Personal"}, {"label": "Marital Status", "type": "select", "options": ["SINGLE", "MARRIED"], "group": "Personal"}, {"label": "Spouse/Father Name", ", "options": [], "group": "Bank & Salary"}, {"label": "PF", "type": "select", "options": ["YES", "NO"], "group": "Bank & Salary"}, {"label": "PF No.", "type": "text", "options": [], "group": "Bank & Salary"}, {"label": "Bonus", "type": "text", "options": [], "group": "Bank & Salary"}, {"label": "Blood Group", "type": "text", "options": [], "group": "Personal"}, {"label": "Date of Exit", "type": "date", "options": [], "group": "Exit"}, {"label": "UAN No", "type": "text", "options": [], "group": "Bank & Salary"}, {"label": "Basic", "type": "number", "options": [], "group": "Bank & Salary"}, {"label": "HRA", "type": "number", "options": [], "group": "Bank & Salary"}, {"label": "TA", "type": "number", "options": [], "group": "Bank & Salary"}, {"label": "Fuel", "type": "number", "options": [], "group": "Bank & Salary"}, {"label": "Gross Salary", "type": "number", "options": [], "group": "Bank & Salary"}, {"label": "In Words", "type": "text", "options": [], "group": "Bank & Salary"}, {"label": "Office Portal Data Upload", "type": "text", "options": [], "group": "Assets"}, {"label": "IT Assets Handedover", "type": "select", "options": ["YES", "NO"], "group": "Assets"}, {"label": "Asset No. (Laptop/Desktop)", "type": "text", "options": [], "group": "Assets"}, {"label": "Mobile Asset", "type": "text", "options": [], "group": "Assets"}, {"label": "Asset Updated in OP", "type": "text", "options": [], "group": "Assets"}, {"label": "Area (Team)", "type": "text", "options": [], "group": "Employment"}, {"label": "Team", "type": "text", "options": [], "group": "Employment"}, {"label": "Spouse Name", "type": "text", "options": [], "group": "Family"}, {"label": "Spouse Date of Birth", "type": "date", "options": [], "group": "Family"}, {"label": "Child 1 Name", "type": "text", "options": [], "group": "Family"}, {"label": "Child 1 Date of Birth", "type": "date", "options": [], "group": "Family"}, {"label": "Child 2 Name", "type": "text", "options": [], "group": "Family"}, {"label": "Child 2 Date of Birth", "type": "date", "options": [], "group": "Family"}, {"label": "Father's Name", "type": "text", "options": [], "group": "Family"}, {"label": "Father's Date of Birth", "type": "date", "options": [], "group": "Family"}, {"label": "Mother's Name", "type": "text", "options": [], "group": "Family"}, {"label": "Mother's Date of Birth", "type": "date", "options": [], "group": "Family"}, {"label": "Job Description", "type": "textarea", "options": [], "group": "Employment"}, {"label": "DOE", "type": "date", "options": [], "group": "Exit"}, {"label": "Date of Exit (2)", "type": "date", "options": [], "group": "Exit"}, {"label": "__blank__", "type": "text", "options": [], "group": "Other"}];          
    
    const LIST_COLS = [[0, "Emp ID"], [1, "Employee Name"], [2, "Status"], [7, "Designation"], [8, "Department"], [11, "Location"], [13, "DOJ"], [21, "Contact No."], [3, "Company"]];
    const STATUS_COL = 2;
    const MOVE_CFG = {"action": "moveToResignation", "label": "Move to Resignation", "btn_class": "btn-amber", "confirm": null, "extra_fields": [["empStatus", "Emp Status", "select", ["Resigned", "Notice Period", "Absconded", "Terminated"]], ["dor", "Date of Resignation (DOR)", "date", null], ["lwd", "Last Working Day (LWD)", "date", null], ["noticePay", "Notice Pay", "text", null], ["itAssetHandover", "IT Asset Handover", "select", ["Yes", "No", "Pending"]], ["fnf", "FNF Remarks", "text", null], ["relieving", "Relieving", "text", null], ["remarks", "Remarks", "textarea", null]]};

    let allRows = [];       
    let currentFilteredRows = []; 
    let editingRowIndex = null;
    let moveRowIndex = null;

    function statusPill(val){
      if(!val) return '';
      const v = String(val).toLowerCase();
      let cls = 'pill-blue';
      if(v.includes('active') || v.includes('done')) cls = 'pill-green';
      if(v.includes('resign') || v.includes('notice') || v.includes('pending') || v.includes('process')) cls = 'pill-amber';
      if(v.includes('terminat') || v.includes('abscond') || v.includes('inactive')) cls = 'pill-red';
      return `<span class="pill ${cls}">${val}</span>`;
    }

    function renderHead(){
      const th = LIST_COLS.map(([idx,label]) => `<th>${label}</th>`).join('');
      document.getElementById('tableHead').innerHTML = th + '<th>Actions</th>' + '<th>Move</th>';
    }

    // UPDATE: Render table with EXACT matching for status fix
    function renderTable(){
      const q = (document.getElementById('searchBox').value || '').toLowerCase();
      const statusFilter = document.getElementById('statusFilter').value;
      const compFilter = document.getElementById('companyFilter').value;
      const deptFilter = document.getElementById('deptFilter').value;

      currentFilteredRows = allRows.filter(r => {
        // EXACT match for Status to avoid 'INACTIVE' matching 'ACTIVE'
        const rowStatus = String(r.values[STATUS_COL] || '').toUpperCase();
        if(statusFilter !== 'ALL' && rowStatus !== statusFilter) return false;
        
        // Exact Match for Company
        const rowComp = String(r.values[3] || '').trim();
        if(compFilter !== 'ALL' && rowComp !== compFilter) return false;

        // Exact Match for Department
        const rowDept = String(r.values[8] || '').trim();
        if(deptFilter !== 'ALL' && rowDept !== deptFilter) return false;

        // General Text Search
        if(q){
          return r.values.some(v => String(v||'').toLowerCase().includes(q));
        }
        return true;
      });

      document.getElementById('recordCount').textContent = `Showing ${currentFilteredRows.length} of ${allRows.length} total`;
      const body = document.getElementById('tableBody');
      
      if(currentFilteredRows.length === 0){
        body.innerHTML = `<tr><td colspan="${LIST_COLS.length+2}"><div class="empty-state">No records found matching filters</div></td></tr>`;
        return;
      }
      
      body.innerHTML = currentFilteredRows.map(r => {
        const cells = LIST_COLS.map(([idx]) => {
          const v = r.values[idx];
          if(idx === STATUS_COL) return `<td>${statusPill(v)}</td>`;
          return `<td>${v == null ? '' : v}</td>`;
        }).join('');
        const moveBtn = MOVE_CFG ? `<td><button class="btn btn-sm ${MOVE_CFG.btn_class}" onclick="openMoveModal(${r.rowIndex})">${MOVE_CFG.label}</button></td>` : '';
        return `<tr>
          ${cells}
          <td class="actions-cell">
            <button class="btn btn-sm btn-ghost" onclick="openEditModal(${r.rowIndex})">Edit</button>
            <button class="btn btn-sm btn-danger" onclick="removeRecord(${r.rowIndex})">Del</button>
          </td>
          ${moveBtn}
        </tr>`;
      }).join('');
    }

    // UPDATE: Populate dropdown options dynamically and Build KPIs
    function populateFiltersAndKpis() {
      const comps = new Set();
      const depts = new Set();
      const statuses = new Set();
      
      let countActive = 0;
      let countInactive = 0;
      let countResigned = 0;
      
      allRows.forEach(r => {
        const comp = String(r.values[3] || '').trim();
        const dept = String(r.values[8] || '').trim();
        const status = String(r.values[STATUS_COL] || '').trim().toUpperCase();

        if(comp) comps.add(comp);
        if(dept) depts.add(dept);
        if(status) {
          statuses.add(status);
          if(status === 'ACTIVE') countActive++;
          else if(status === 'INACTIVE') countInactive++;
          else if(status === 'RESIGNED') countResigned++;
        }
      });

      // 1. Build KPI Dashboard at top
      const kpiGrid = document.getElementById('topKpis');
      kpiGrid.innerHTML = `
        <div class="kpi" style="border-left:3px solid var(--accent)">
          <div class="ico">📋</div><div class="l">Total Records</div><div class="n">${allRows.length}</div>
        </div>
        <div class="kpi" style="border-left:3px solid var(--green)">
          <div class="ico">✅</div><div class="l">Active</div><div class="n">${countActive}</div>
        </div>
        <div class="kpi" style="border-left:3px solid var(--amber)">
          <div class="ico">🚪</div><div class="l">Resigned</div><div class="n">${countResigned}</div>
        </div>
        <div class="kpi" style="border-left:3px solid var(--red)">
          <div class="ico">❌</div><div class="l">Inactive</div><div class="n">${countInactive}</div>
        </div>
      `;

      // 2. Populate Status Filter Dynamically
      const sSelect = document.getElementById('statusFilter');
      sSelect.innerHTML = '<option value="ALL">Status: All Records</option>';
      Array.from(statuses).sort().forEach(s => {
         const opt = new Option(`Status: ${s}`, s);
         if(s === 'ACTIVE') opt.selected = true; // Auto-select ACTIVE on load
         sSelect.add(opt);
      });

      // 3. Populate Company Filter
      const cSelect = document.getElementById('companyFilter');
      cSelect.innerHTML = '<option value="ALL">Company: All</option>';
      Array.from(comps).sort().forEach(c => cSelect.add(new Option(c, c)));

      // 4. Populate Dept Filter
      const dSelect = document.getElementById('deptFilter');
      dSelect.innerHTML = '<option value="ALL">Dept: All</option>';
      Array.from(depts).sort().forEach(d => dSelect.add(new Option(d, d)));
    }

    // UPDATE: CSV Export logic
    function downloadCSV() {
      if(!currentFilteredRows || currentFilteredRows.length === 0){
        toast('No data to download!', 'error');
        return;
      }
      
      // Top Header Row
      let csvData = FIELDS.map(f => `"${String(f.label).replace(/"/g, '""')}"`).join(',') + '\n';
      
      // Appending rows
      currentFilteredRows.forEach(r => {
        const rowString = r.values.map(val => {
          let strVal = val == null ? '' : String(val);
          return `"${strVal.replace(/"/g, '""')}"`;
        }).join(',');
        csvData += rowString + '\n';
      });

      // Browser trigger for downloading
      const blob = new Blob([csvData], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.setAttribute('href', url);
      link.setAttribute('download', 'Active_Employees_Data.csv');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    async function loadRecords(){
      try{
        const data = await apiGet('list', { sheet: SHEET_KEY });
        allRows = data.rows;
        renderHead();
        populateFiltersAndKpis(); // Calculate KPIs and populate dropdowns dynamically
        renderTable();
      }catch(err){
        document.getElementById('tableBody').innerHTML = `<tr><td colspan="10">Error: ${err.message}</td></tr>`;
      }
    }

    // ====== Add / Edit modal ======
    function fieldInput(f, idx, value){
      const id = `f_${idx}`;
      value = value == null ? '' : value;
      if(f.type === 'select'){
        const opts = f.options.map(o => `<option value="${o}" ${String(value)===o?'selected':''}>${o}</option>`).join('');
        return `<select id="${id}"><option value="">--</option>${opts}</select>`;
      }
      if(f.type === 'textarea'){
        return `<textarea id="${id}">${value}</textarea>`;
      }
      const type = f.type === 'date' ? 'date' : (f.type === 'number' ? 'text' : 'text');
      return `<input type="${type}" id="${id}" value="${String(value).replace(/"/g,'&quot;')}">`;
    }

    function buildForm(values){
      values = values || [];
      const groups = {};
      FIELDS.forEach((f, idx) => {
        if(f.label.startsWith('__blank')) return;
        if(!groups[f.group]) groups[f.group] = [];
        groups[f.group].push([f, idx]);
      });
      let html = '';
      Object.keys(groups).forEach(g => {
        html += `<fieldset><legend>${g}</legend><div class="field-grid">`;
        groups[g].forEach(([f, idx]) => {
          html += `<div class="field"><label>${f.label}</label>${fieldInput(f, idx, values[idx])}</div>`;
        });
        html += `</div></fieldset>`;
      });
      return html;
    }

    function openAddModal(){
      editingRowIndex = null;
      document.getElementById('editModalTitle').textContent = 'Add Record';
      document.getElementById('editModalBody').innerHTML = buildForm([]);
      document.getElementById('editModalOverlay').classList.add('show');
    }

    function openEditModal(rowIndex){
      const row = allRows.find(r => r.rowIndex === rowIndex);
      if(!row) return;
      editingRowIndex = rowIndex;
      document.getElementById('editModalTitle').textContent = 'Edit Record — ' + (row.values[1] || '');
      document.getElementById('editModalBody').innerHTML = buildForm(row.values);
      document.getElementById('editModalOverlay').classList.add('show');
    }

    function closeEditModal(){
      document.getElementById('editModalOverlay').classList.remove('show');
    }

    function collectFormValues(){
      const values = FIELDS.map((f, idx) => {
        const el = document.getElementById(`f_${idx}`);
        return el ? el.value : '';
      });
      return values;
    }

    async function saveRecord(){
      const btn = document.getElementById('saveBtn');
      btn.disabled = true; btn.textContent = 'Saving...';
      try{
        const values = collectFormValues();
        if(editingRowIndex){
          await apiPost({ action: 'updateRecord', sheet: SHEET_KEY, rowIndex: editingRowIndex, values });
          toast('Record updated', 'success');
        }else{
          await apiPost({ action: 'addRecord', sheet: SHEET_KEY, values });
          toast('Record added', 'success');
        }
        closeEditModal();
        loadRecords();
      }catch(err){
        toast(err.message, 'error');
      }finally{
        btn.disabled = false; btn.textContent = 'Save';
      }
    }

    async function removeRecord(rowIndex){
      if(!confirm('Delete this record? This cannot be undone.')) return;
      try{
        await apiPost({ action: 'deleteRecord', sheet: SHEET_KEY, rowIndex });
        toast('Record deleted', 'success');
        loadRecords();
      }catch(err){
        toast(err.message, 'error');
      }
    }

    // ====== Move to next stage ======
    function openMoveModal(rowIndex){
      moveRowIndex = rowIndex;
      if(!MOVE_CFG.extra_fields){
        if(MOVE_CFG.confirm && !confirm(MOVE_CFG.confirm)) return;
        doMove({});
        return;
      }
      document.getElementById('moveModalOverlay').classList.add('show');
    }
    function closeMoveModal(){
      const el = document.getElementById('moveModalOverlay');
      if(el) el.classList.remove('show');
    }
    async function confirmMove(){
      const extra = {};
      if(MOVE_CFG.extra_fields){
        MOVE_CFG.extra_fields.forEach(([key]) => {
          const el = document.getElementById('mv_' + key);
          if(el) extra[key] = el.value;
        });
      }
      closeMoveModal();
      await doMove(extra);
    }
    async function doMove(extra){
      try{
        await apiPost({ action: MOVE_CFG.action, rowIndex: moveRowIndex, extra });
        toast('Moved successfully', 'success');
        loadRecords();
      }catch(err){
        toast(err.message, 'error');
      }
    }

    loadRecords();
</script>
</body>
</html>
